<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ร้านค้าออนไลน์</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ร้านค้า">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDE4FF">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;background:#EDE4FF;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#EDE4FF}
#sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#EEE6FF,#E3D4FB);font:600 15px -apple-system,system-ui,sans-serif;color:#5B47A0;transition:opacity .35s}
#sp img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 34px -14px rgba(90,60,180,.6)}
#sp i{width:26px;height:26px;border-radius:50%;border:3px solid rgba(124,77,255,.25);border-top-color:#7C4DFF;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
#sp.h{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="sp"><img src="/icon-180.png" alt="" id="spi"><i></i><span>กำลังเปิดร้าน…</span></div>
<iframe id="app" title="Softboyprem" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
// เก็บการเข้าสู่ระบบให้ร้าน (iOS ไม่เก็บข้อมูลของเว็บที่ถูกฝัง) — รับ/ส่งเฉพาะค่า sbp* กับหน้าร้านของ Google Apps Script เท่านั้น
// ร้านเช่า: ใช้ไอคอนของร้านเอง (ไม่ใช้ไอคอน Softboyprem)
function setIcon(u){document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(function(l){l.parentNode.removeChild(l)});if(!u)return;["icon","apple-touch-icon"].forEach(function(r){var l=document.createElement("link");l.rel=r;if(r==="icon")l.type="image/png";l.href=u;document.head.appendChild(l)})}
window.addEventListener("message",function(ev){var d=ev.data;if(!d||!d.sbpb||!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin))return;
  try{if(d.sbpb==="hello"){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sbp/.test(k))o[k]=localStorage.getItem(k)}ev.source.postMessage({sbpb:"snap",data:o},ev.origin)}
  else if(d.sbpb==="set"&&/^sbp/.test(d.k))localStorage.setItem(d.k,String(d.v));
  else if(d.sbpb==="del"&&/^sbp/.test(d.k))localStorage.removeItem(d.k);
  else if(d.sbpb==="icon"&&window.SBP_TEN&&/^data:image\/png;base64,/.test(d.u||"")&&d.u.length<300000){setIcon(d.u)}
  else if(d.sbpb==="nf"&&window.SBP_ALTS&&window.SBP_ALTS.length&&d.t===window.SBP_TEN&&(window.SBP_NFS=window.SBP_NFS||[]).indexOf(ev.source)<0){window.SBP_NFS.push(ev.source);window.SBP_ALT=window.SBP_ALTS.shift();window.SBP_CUR=window.SBP_ALT.split("?")[0];try{localStorage.removeItem(window.SBP_CK)}catch(e){}window.SBP_SWAP=(window.SBP_SWAP||0)+1;var f=document.getElementById("app"),sp=document.getElementById("sp");sp.className="";sp.querySelector("span").textContent="กำลังค้นหาร้าน…";f.onload=function(){setTimeout(function(){sp.className="h"},250)};f.src=window.SBP_ALT}
  else if(d.sbpb==="title"&&d.t){if(window.SBP_CK&&window.SBP_CUR)try{localStorage.setItem(window.SBP_CK,window.SBP_CUR)}catch(e){}document.title=String(d.t).slice(0,60);var m=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(m&&window.SBP_TEN)m.content=document.title}}catch(e){}});
</script>
<script>
// ลิงก์ร้าน (Web app URL ที่ลงท้ายด้วย /exec) — เปลี่ยนได้ที่บรรทัดนี้บรรทัดเดียว
var SHOP_URL = "https://script.google.com/macros/s/AKfycbyqOP5dIr4CvbnpPMmwvffKiIowncsooisWGI8PDNoqdZ73m5UgYNqDQ2aYru_AVHAD7w/exec";
(function(){
  // ลิงก์ร้านแบบชื่อร้าน: /ชื่อร้าน = หน้าร้าน · /ชื่อร้าน/admin = หลังบ้าน · /rent = หน้าเช่าร้าน
  var seg = location.pathname.replace(/\/+$/, "").split("/").filter(Boolean).map(function(x){ try { return decodeURIComponent(x); } catch (e) { return x; } });
  // ระบบทดสอบ: /test/... ใช้ไฟล์ Apps Script สำหรับทดสอบ (ข้อมูลแยกจากร้านจริง)
  var TEST_URL = "https://script.google.com/macros/s/AKfycbykpd3RutNLAN1N6PHEel4mCNDTf_MLs7CeuVdlP8QyetfOREV8TYMdEYj1fr7z_P_X/exec";
  var isTest = String(seg[0] || "").toLowerCase() === "test";
  if (isTest) { seg = seg.slice(1); SHOP_URL = TEST_URL; document.title = "ทดสอบ · " + document.title; }
  var slug = String(seg[0] || "").toLowerCase(), sub = String(seg[1] || "").toLowerCase();
  var q = location.search ? location.search.slice(1).replace(/(^|&)s=[^&]*/g, "") .replace(/^&/, "") : "", u = SHOP_URL;
  var f = document.getElementById("app"), sp = document.getElementById("sp"), msg = sp.querySelector("span");
  if (isTest && !slug) { f.src = SHOP_URL + "?shop=1"; f.onload = function(){ setTimeout(function(){ sp.className = "h"; }, 250); }; return; }
  if (isTest && slug === "admin" && !sub) { f.src = SHOP_URL; f.onload = function(){ setTimeout(function(){ sp.className = "h"; }, 250); }; return; }
  var ok = /^[a-z0-9][a-z0-9-]{2,23}$/.test(slug) && seg.length <= 2 && (!sub || sub === "admin");
  if (!ok) { sp.querySelector("i").style.display = "none"; msg.innerHTML = 'ไม่พบหน้านี้ · <a href="/" style="color:#5B47A0">กลับหน้าแรก</a>'; return; }
  if (SHOP_URL.indexOf("script.google.com") < 0) { sp.querySelector("i").style.display = "none"; msg.textContent = "ร้านกำลังตั้งค่า กรุณาลองใหม่ภายหลัง"; return; }
  var sep = function(){ return u.indexOf("?") < 0 ? "?" : "&"; };
  if (slug === "rent" && !sub) { u += sep() + "shop=1&rent=1"; msg.textContent = "กำลังเปิด…"; }
  else { window.SBP_TEN = slug; document.getElementById("spi").style.display = "none"; setIcon("");
    if (sub === "admin") { u += sep() + "s=" + slug; msg.textContent = "กำลังเปิดหลังร้าน…"; }
    else u += sep() + "shop=1&s=" + slug; }
  if (q) u += "&" + q;
  f.onload = function(){ setTimeout(function(){ sp.className = "h"; }, 250); };
  setTimeout(function(){ sp.className = "h"; }, 9000);
  // ร้านอาจสร้างไว้อีกระบบ (ร้านจริง ⇄ ทดสอบ) — ถ้าระบบนี้ตอบว่า "ไม่พบร้านนี้" จะลองอีกระบบให้อัตโนมัติ 1 ครั้ง
  // รายชื่อระบบทั้งหมด (เพิ่มลิงก์ /exec ของไฟล์ใหม่ต่อท้ายได้) — ร้านอยู่ไฟล์ไหนก็เปิดได้
  if (window.SBP_TEN) { var ALL = [
      "https://script.google.com/macros/s/AKfycbyqOP5dIr4CvbnpPMmwvffKiIowncsooisWGI8PDNoqdZ73m5UgYNqDQ2aYru_AVHAD7w/exec",
      TEST_URL,
      "https://script.google.com/macros/s/AKfycbx6DP7amofuld9r8fubfNHLVfwOQPtv06IU9_ZJwe6_OFnVZuDTryW3y38T0DmstUIf/exec"
    ];
    // จำว่าร้านนี้อยู่ระบบไหน ครั้งต่อไปเปิดตรงไปเลย (ไม่ต้องไล่หา)
    var ck = "sbpsys~" + slug, c = ""; try { c = localStorage.getItem(ck) || ""; } catch (e) {}
    if (c && c !== SHOP_URL && ALL.indexOf(c) >= 0) { u = u.replace(SHOP_URL, c); SHOP_URL = c; }
    window.SBP_CK = ck; window.SBP_CUR = SHOP_URL;
    window.SBP_ALTS = ALL.filter(function(x){ return x !== SHOP_URL; }).map(function(x){ return u.replace(SHOP_URL, x); }); }
  f.src = u;
})();
</script>
</body>
</html>
