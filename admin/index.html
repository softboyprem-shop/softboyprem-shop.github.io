<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Softboyprem หลังร้าน</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SBP หลังร้าน">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDE4FF">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;background:#EDE4FF;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#EDE4FF}
#sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#EEE6FF,#E3D4FB);font:600 15px -apple-system,system-ui,sans-serif;color:#5B47A0;transition:opacity .35s}
#sp img{width:112px;height:112px;border-radius:26px;box-shadow:0 14px 34px -14px rgba(90,60,180,.6)}
#sp i{width:26px;height:26px;border-radius:50%;border:3px solid rgba(124,77,255,.25);border-top-color:#7C4DFF;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
#sp.h{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="sp"><img src="../icon-180.png" alt=""><i></i><span>กำลังเปิดหลังร้าน…</span></div>
<iframe id="app" title="Softboyprem" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
// เก็บการเข้าสู่ระบบให้ร้าน (iOS ไม่เก็บข้อมูลของเว็บที่ถูกฝัง) — รับ/ส่งเฉพาะค่า sbp* กับหน้าร้านของ Google Apps Script เท่านั้น
window.addEventListener("message",function(ev){var d=ev.data;if(!d||!d.sbpb||!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin))return;
  try{if(d.sbpb==="hello"){var o={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sbp/.test(k))o[k]=localStorage.getItem(k)}ev.source.postMessage({sbpb:"snap",data:o},ev.origin)}
  else if(d.sbpb==="set"&&/^sbp/.test(d.k))localStorage.setItem(d.k,String(d.v));
  else if(d.sbpb==="del"&&/^sbp/.test(d.k))localStorage.removeItem(d.k)}catch(e){}});
</script>
<script>
// ลิงก์ร้าน (Web app URL ที่ลงท้ายด้วย /exec) — เปลี่ยนได้ที่บรรทัดนี้บรรทัดเดียว
var SHOP_URL = "https://script.google.com/macros/s/AKfycbx6DP7amofuld9r8fubfNHLVfwOQPtv06IU9_ZJwe6_OFnVZuDTryW3y38T0DmstUIf/exec";
(function(){
  var q = location.search ? location.search.slice(1) : "", u = SHOP_URL;
  // หน้าหลังร้าน (เจ้าของร้าน/พนักงาน)
  if (q) u += (u.indexOf("?") < 0 ? "?" : "&") + q; // หลังร้าน: ไม่ใส่ shop=1
  var f = document.getElementById("app"), sp = document.getElementById("sp");
  if (SHOP_URL.indexOf("script.google.com") < 0) { sp.querySelector("i").style.display = "none"; sp.querySelector("span").textContent = "ร้านกำลังตั้งค่า กรุณาลองใหม่ภายหลัง"; return; }
  f.onload = function(){ setTimeout(function(){ sp.className = "h"; }, 250); };
  setTimeout(function(){ sp.className = "h"; }, 9000);
  f.src = u;
})();
</script>
</body>
</html>
